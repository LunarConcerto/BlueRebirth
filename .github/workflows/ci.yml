name: CI

on:
  push:
    branches:
      - master
      - WakabaMutsumi
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BlueOath.Local.sln

      - name: Build
        run: dotnet build BlueOath.Local.sln -c ${{ matrix.configuration }} --no-restore

      - name: Unit Tests
        run: dotnet test BlueOath.Local.sln --no-build -c ${{ matrix.configuration }} --verbosity normal

  publish:
    name: Publish Launcher Bundle (Release)
    runs-on: windows-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & publish release bundle
        shell: pwsh
        run: |
          $OutputDir = Join-Path $env:RUNNER_TEMP ("BlueOath-Release-" + $env:GITHUB_RUN_NUMBER)
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null
          dotnet run --project "$PWD\src\BlueOath.Publisher\BlueOath.Publisher.csproj" -- "--output=$OutputDir\BlueOath-Release" "--configuration=Release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundleDir = Join-Path $OutputDir "BlueOath-Release"
          if (-not (Test-Path (Join-Path $bundleDir "launcher-settings.json"))) {
            Write-Error "ERROR: launcher-settings.json is missing."
            exit 1
          }
          if (-not (Test-Path (Join-Path $bundleDir "BlueOath.Launcher.Wpf.exe"))) {
            Write-Error "ERROR: BlueOath.Launcher.Wpf.exe is missing."
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-bundle-${{ github.run_number }}
          path: ${{ runner.temp }}/BlueOath-Release-${{ github.run_number }}/BlueOath-Release
          if-no-files-found: error

      - name: Prepare GitHub Release package
        id: release_meta
        shell: pwsh
        run: |
          $tagName = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME
          } else {
            "v1.0.$env:GITHUB_RUN_NUMBER"
          }
          $bundleDir = Join-Path $env:RUNNER_TEMP "BlueOath-Release-$env:GITHUB_RUN_NUMBER\BlueOath-Release"
          $packagePath = Join-Path $env:RUNNER_TEMP "BlueOath-Release-$env:GITHUB_RUN_NUMBER\BlueOath-Release-$tagName.zip"
          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $packagePath -Force
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: BlueOath ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.release_meta.outputs.package_path }}

  publish_debug:
    name: Publish Launcher Bundle (Debug)
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/WakabaMutsumi'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & publish debug bundle
        shell: pwsh
        run: |
          $OutputDir = Join-Path $env:RUNNER_TEMP ("BlueOath-Debug-" + $env:GITHUB_RUN_NUMBER)
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null
          dotnet run --project "$PWD\src\BlueOath.Publisher\BlueOath.Publisher.csproj" -- "--output=$OutputDir\BlueOath-Release" "--configuration=Debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundleDir = Join-Path $OutputDir "BlueOath-Release"
          if (-not (Test-Path (Join-Path $bundleDir "launcher-settings.json"))) {
            Write-Error "ERROR: launcher-settings.json is missing."
            exit 1
          }
          if (-not (Test-Path (Join-Path $bundleDir "BlueOath.Launcher.Wpf.exe"))) {
            Write-Error "ERROR: BlueOath.Launcher.Wpf.exe is missing."
            exit 1
          }

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-bundle-debug-${{ github.run_number }}
          path: ${{ runner.temp }}/BlueOath-Debug-${{ github.run_number }}/BlueOath-Release
          if-no-files-found: error

      - name: Prepare Debug prerelease package
        id: debug_release_meta
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "BlueOath-Debug-$env:GITHUB_RUN_NUMBER\BlueOath-Release"
          $packagePath = Join-Path $env:RUNNER_TEMP "BlueOath-Debug-$env:GITHUB_RUN_NUMBER\BlueOath-Debug-$env:GITHUB_RUN_NUMBER.zip"
          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $packagePath -Force
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Publish Debug GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: BlueOath Debug v1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ${{ steps.debug_release_meta.outputs.package_path }}
