name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BlueOath.Local.sln

      - name: Build
        run: dotnet build BlueOath.Local.sln -c ${{ matrix.configuration }} --no-restore

      - name: Unit Tests
        run: dotnet test BlueOath.Local.sln --no-build -c ${{ matrix.configuration }} --verbosity normal

  publish:
    name: Publish Launcher Bundle
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & publish release bundle
        shell: pwsh
        run: |
          $OutputDir = Join-Path $env:RUNNER_TEMP ("BlueOath-Release-" + $env:GITHUB_RUN_NUMBER)
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null
          & "$PWD\publish-release.bat" $OutputDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundleDir = Join-Path $OutputDir "BlueOath-Release"
          if (-not (Test-Path (Join-Path $bundleDir "launcher-settings.json"))) {
            Write-Error "ERROR: launcher-settings.json is missing."
            exit 1
          }
          if (-not (Test-Path (Join-Path $bundleDir "BlueOath.Launcher.Wpf.exe"))) {
            Write-Error "ERROR: BlueOath.Launcher.Wpf.exe is missing."
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-bundle-${{ github.run_number }}
          path: ${{ runner.temp }}/BlueOath-Release-${{ github.run_number }}/BlueOath-Release
          if-no-files-found: error
